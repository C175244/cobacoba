name: Build tamper-test APK

on:
  workflow_dispatch:
    inputs:
      watermark:
        description: "Teks watermark (opsional; \\n untuk baris baru)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "tamper-test/apk/watermark.txt"
      - "tamper-test/apk/patch_apk.py"
      - "soalpintar-v2-release.apk"
      - ".github/workflows/build-tamper-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Override watermark (manual run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.watermark != '' }}
        env:
          WM_TEXT: ${{ inputs.watermark }}
        run: printf '%s\n' "$WM_TEXT" | sed 's/\\n/\n/g' > tamper-test/apk/watermark.txt

      - name: Download tools
        run: |
          curl -sSL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          curl -sSL -o uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Decode and patch
        run: |
          java -jar apktool.jar d -f -o work soalpintar-v2-release.apk
          python3 tamper-test/apk/patch_apk.py work

      - name: Build
        run: java -jar apktool.jar b work -o tampertest-unsigned.apk

      - name: Sign
        run: |
          keytool -genkeypair -v -keystore test.keystore -alias tampertest \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass tampertest -keypass tampertest \
            -dname "CN=TamperTest,OU=QA,O=Local,L=Local,ST=Local,C=ID"
          java -jar uber-apk-signer.jar --apks tampertest-unsigned.apk \
            --ks test.keystore --ksAlias tampertest \
            --ksPass tampertest --ksKeyPass tampertest --allowResign --overwrite
          mv tampertest-unsigned.apk soalpintar-tampertest.apk
          sha256sum soalpintar-tampertest.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tamper-apk
          path: soalpintar-tampertest.apk
          retention-days: 7
